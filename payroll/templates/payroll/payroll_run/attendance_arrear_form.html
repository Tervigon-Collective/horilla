{% extends "index.html" %}
{% load i18n %}

{% block content %}
{% include "payroll/india_statutory/_styles.html" %}
<div class="is-page">
  <div class="is-page-head">
    <h1 class="is-page-head__title">{% trans "Create attendance arrear" %}</h1>
  </div>
  <div class="is-section">
    <div class="is-section__body">
      <form method="post">
        {% csrf_token %}
        <div class="is-form-grid is-form-grid--2">
          <div class="is-field" style="grid-column:1 / -1;">
            <label class="oh-label">{% trans "Employee" %}</label>
            <select class="oh-select" name="employee_id" required>
              {% for e in employees %}
              <option value="{{ e.id }}">{{ e }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="is-field">
            <label class="oh-label">{% trans "Source period start" %}</label>
            <input class="oh-input" type="date" name="source_period_start" required>
          </div>
          <div class="is-field">
            <label class="oh-label">{% trans "Source period end" %}</label>
            <input class="oh-input" type="date" name="source_period_end" required>
          </div>
          <div class="is-field">
            <label class="oh-label">{% trans "Days (+ paid / − recovery)" %}</label>
            <input class="oh-input" type="number" step="0.5" name="days" required>
          </div>
          <div class="is-field">
            <label class="oh-label">{% trans "Reason" %}</label>
            <input class="oh-input" name="reason">
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="oh-btn oh-btn--secondary" type="submit">{% trans "Create" %}</button>
          <a class="oh-btn oh-btn--light" href="{% url 'attendance-arrear-list' %}">{% trans "Cancel" %}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
