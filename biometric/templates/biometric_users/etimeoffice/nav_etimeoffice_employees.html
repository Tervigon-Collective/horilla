{% load i18n %}{% load static %}
<section class="oh-main__topbar" x-data="{searchShow: false}">
    <div class="oh-main__titlebar oh-main__titlebar--left">
        <div class="oh-main__titlebar-title fw-bold mb-0 text-dark">
            {% trans "Employees" %}
        </div>
        <a
            class="oh-main__titlebar-search-toggle"
            role="button"
            aria-label="{% trans 'Toggle Search' %}"
            @click="searchShow = !searchShow"
        >
            <ion-icon name="search-outline" class="oh-main__titlebar-serach-icon"></ion-icon>
        </a>
    </div>

    <div class="oh-main__titlebar oh-main__titlebar--right">
        <div class="oh-input-group oh-input__search-group" :class="searchShow ? 'oh-input__search-group--show' : ''">
            <ion-icon name="search-outline" class="oh-input-group__icon oh-input-group__icon--left"></ion-icon>
            <input
                type="text"
                hx-get="{% url 'search-employee-in-device' %}?device={{device_id}}"
                placeholder="{% trans 'Search' %}"
                name="search"
                hx-trigger="keyup changed delay:.2s"
                hx-target="#eTimeOfficeUsersList"
                class="oh-input oh-input__icon"
                hx-vals='{"view":"{{request.GET.view}}"}'
                aria-label="{% trans 'Search Input' %}"
            >
        </div>
        <div class="oh-main__titlebar-button-container">
            <div class="oh-btn-group ml-2">
                <div class="oh-dropdown" x-data="{open: false}">
                    <button
                        class="oh-btn oh-btn--dropdown oh-btn oh-btn--shadow"
                        @click="open = !open"
                        @click.outside="open = false"
                    >
                        {% trans "Actions" %}
                    </button>
                    <div class="oh-dropdown__menu oh-dropdown__menu--right" x-show="open" style="display: none">
                        <ul class="oh-dropdown__items">
                            <li class="oh-dropdown__item">
                                <a
                                    href="#"
                                    class="oh-dropdown__link"
                                    data-toggle="oh-modal-toggle"
                                    data-target="#objectCreateModal"
                                    hx-get="{%url 'map-biometric-users' device_id %}"
                                    hx-target="#objectCreateModalTarget"
                                >
                                    {% trans "Map Employee" %}
                                </a>
                            </li>
                            {% if realtime and perms.biometric.change_biometricdevices %}
                                <li class="oh-dropdown__item">
                                    <form method="post" action="{% url 'push-realtime-users' device_id %}"
                                        onsubmit="return confirm('{% trans "Send all linked employees (ID and name) to the device? Enrolled faces are not changed." %}')">
                                        {% csrf_token %}
                                        <button type="submit" class="oh-dropdown__link" style="border:0;background:none;width:100%;text-align:left">
                                            {% trans "Push Employees to Device" %}
                                        </button>
                                    </form>
                                </li>
                            {% endif %}
                            {% if perms.delete_biometricdevices %}
                                <li class="oh-dropdown__item">
                                    <a
                                        href="#"
                                        class="oh-dropdown__link oh-dropdown__link--danger"
                                        onclick="deleteETimeOfficeUsers(this)"
                                        data-action="delete"
                                    >{% trans "Delete" %}</a>
                                </li>
                            {% endif %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
