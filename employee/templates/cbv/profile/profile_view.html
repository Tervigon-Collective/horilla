{% load i18n static %}
<div>
    {% include "generic/horilla_profile_view.html" %}
</div>

<form id="employee-reset-password-form"
      action="{% url 'employee-reset-password' %}"
      method="post"
      class="hidden"
      style="display:none;">
{% csrf_token %}
<input type="hidden" name="email" value="{% firstof instance.employee_user_id.username instance.email '' %}" />
<button id="reset-button" type="submit" tabindex="-1" aria-hidden="true"></button>
</form>


<form hidden action="{% url 'employee-account-block-unblock' instance.id %}" id="block-form">
{% csrf_token %}
<button  id="block-button" type="submit" style=" border: none; background: transparent;">
</button>
</form>


{% comment %} <script>
    document.getElementById('block-button').onclick = function() {
        var message = '{% if instance.employee_user_id.is_active %}{% trans "Do you really want to prevent this employee from accessing and logging into this webpage?" %}{% else %}{% trans "Do you really want to allow this employee to access and log into this webpage?" %}{% endif %}';
        return confirm(message);
    };
</script> {% endcomment %}

<script>
    window.horillaSendPasswordReset = function () {
        var form = document.getElementById('employee-reset-password-form');
        if (!form) {
            alert('{% trans "Password reset form is missing on this page." %}');
            return;
        }
        var emailInput = form.querySelector('[name=email]');
        var email = emailInput ? (emailInput.value || '') : '';
        if (!email) {
            alert('{% trans "This employee has no login username/email to send a reset link." %}');
            return;
        }
        var confirmText = '{% trans "Send a password reset link to this employee\'s registered email?" %}';
        if (window.Swal) {
            Swal.fire({
                text: confirmText,
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#008000",
                cancelButtonColor: "#6c757d",
                confirmButtonText: (window.i18nMessages && i18nMessages.confirm) || '{% trans "Confirm" %}',
                cancelButtonText: (window.i18nMessages && i18nMessages.cancel) || '{% trans "Cancel" %}'
            }).then(function (result) {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        } else if (confirm(confirmText)) {
            form.submit();
        }
    };
    $('#block-account').click(function() {
    var message = '{% if instance.employee_user_id.is_active %}{% trans "Do you really want to prevent this employee from accessing and logging into this webpage?" %}{% else %}{% trans "Do you really want to allow this employee to access and log into this webpage?" %}{% endif %}';

        Swal.fire({
            text: message,
            icon: "question",
            showCancelButton: true,
            confirmButtonColor: "#008000",
            cancelButtonColor: "#6c757d",
            confirmButtonText: i18nMessages.confirm,
            cancelButtonText: i18nMessages.cancel
        }).then((result) => {
            if (result.isConfirmed) {
                // Redirect to the URL
                document.getElementById('block-form').submit();
            }
        });
    });
</script>
